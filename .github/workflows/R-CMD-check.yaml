name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install R package dependencies
        run: |
          R -e 'install.packages(c("devtools","roxygen2","testthat","R6"), repos="https://cloud.r-project.org")'
      - name: Check package
        run: R CMD check --no-manual --as-cran .
