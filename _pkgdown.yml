url: https://ugurdar.github.io/datadriftR/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2A9D8F"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  title: datadriftR - Data Drift Detection for R
  description: >
    Real-time detection of data drift in streaming data with
    multiple statistical methods.

authors:
  Ugur Dar:
    href: https://github.com/ugurdar
  Mustafa Cavus:
    href: https://orcid.org/0000-0002-6172-5449

navbar:
  structure:
    left:  [home, getstarted, reference]
    right: [search, github]
  components:
    getstarted:
      text: Get Started
      icon: fas fa-rocket
      menu:
        - text: Overview
          href: articles/datadriftR-intro.html#intro
        - text: Drift taxonomy
          href: articles/datadriftR-intro.html#drift-taxonomy
        - text: Drift patterns
          href: articles/datadriftR-intro.html#drift-patterns
        - text: Quick start
          href: articles/datadriftR-intro.html#quick-start
        - text: Detector examples
          href: articles/detector-examples.html
        - text: Error-rate detectors
          href: articles/datadriftR-intro.html#error-rate-detectors
        - text: Continuous streams
          href: articles/datadriftR-intro.html#continuous-streams
        - text: KL divergence
          href: articles/datadriftR-intro.html#kl-divergence
        - text: Model behavior
          href: articles/datadriftR-intro.html#model-behavior
        - text: Quick reference
          href: articles/datadriftR-intro.html#quick-reference
    reference:
      text: Reference
      icon: fas fa-book
      href: reference/index.html
    github:
      icon: fab fa-github
      href: https://github.com/ugurdar/datadriftR
      aria-label: GitHub

reference:
  - title: High-Level Interface
    desc: Simple function for quick drift detection
    contents:
      - detect_drift

  - title: Error-Rate Based Detectors
    desc: Detectors that monitor error rates
    contents:
      - DDM
      - EDDM

  - title: Hoeffding Bound Methods
    desc: Detectors using Hoeffding's inequality
    contents:
      - HDDM_A
      - HDDM_W

  - title: Distribution-Based Detectors
    desc: Statistical test-based methods
    contents:
      - KSWIN
      - KLDivergence
      - ADWIN

  - title: Sequential Analysis Methods
    desc: Cumulative statistics methods
    contents:
      - PageHinkley

  - title: Profile-Based Methods
    desc: Functional data analysis methods
    contents:
      - ProfileDifference

footer:
  structure:
    left: developed_by
    right: built_with
